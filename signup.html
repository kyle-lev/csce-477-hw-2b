<!DOCTYPE html>
<title>Juice Shop Signup</title>
<h1>Sign Up</h1>
<span><p>Email:</p></span><input id="email" type="text">
<span><p>Password:</p></span><input id="password" type="password">
<br><br>
<button onclick="login()">Login</button>
<p style="color:red" id="error"></p>
<p><a href="/">Already a customer?</a></p>

<script type="text/javascript">
    function login() {
        let email = document.getElementById("email").value;
        let password = document.getElementById("password").value;
        let error = document.getElementById("error");

        if(!email.match(/.+@.+/)) {
            error.innerText = "Invalid email!";
            return;
        }

        if(password.length < 8) {
            error.innerText = "Password must be at least 8 characters!";
            return;
        }

        error.innerText = "";

        fetch("/createuser", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({"email": email, "password": password})})
            .then((res) => {
                switch(res.status) {
                    case 403:
                        error.innerText = "An account already exists with this email!";
                        break;
                    case 200:
                        location.href = "/signup-success";
                        break;
                    default:
                        error.innerText = "Something went wrong!";
                        break;
                }
            })
            .catch((err) => {
                error.innerText = "Something went wrong!";
            })
    }
</script>
